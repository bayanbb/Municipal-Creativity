<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة الأداء الاستراتيجي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#f2f3ef;
  --ink:#3d3d3f; --muted:#6e6e73; --gray:#8e8e93; --track:#f0ede8;
  --green:#079455; --green2:#22a45d; --yellow:#fec84b; --red:#f04438; --red2:#e5484d;
  --brand:#135e4c; --ytext:#e3a008; --blue:#2e90fa;
  --ease:cubic-bezier(.22,1,.36,1);
  --font:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --plex:'IBM Plex Sans Arabic','Tajawal',system-ui,Tahoma,sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--page)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--page);
  background-image:radial-gradient(900px 420px at 70% 0%,rgba(214,232,196,.35),transparent 70%);
  min-height:100%;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ============ Sidebar ============ */
.sidebar{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:252px;
  background:#fffefb;border:1px solid rgba(24,36,33,.08);border-radius:24px;box-shadow:0 16px 25px rgba(30,45,40,.1);
  display:flex;flex-direction:column;z-index:30;transition:width .45s var(--ease);
  animation:slideInR .5s var(--ease) both}
@keyframes slideInR{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.sb-head{height:78px;flex:none;border-bottom:1px solid #edf0ec;display:flex;align-items:center;justify-content:center;position:relative;padding:0 16px}
.brand{font-family:var(--plex);font-weight:700;font-size:15px;color:var(--brand);white-space:nowrap;transition:opacity .25s}
.collapse-btn{position:absolute;left:-15px;top:24px;width:29px;height:29px;border-radius:50%;background:var(--brand);border:3px solid #f2f3ef;
  display:grid;place-items:center;color:#fff;padding:0;box-shadow:0 4px 6px rgba(19,94,76,.28);transition:transform .45s var(--ease),box-shadow .2s}
.collapse-btn svg{width:16px;height:16px;stroke-width:2.2}
.collapse-btn:hover{box-shadow:0 6px 14px rgba(19,94,76,.4);transform:scale(1.08)}
.sb-label{padding:20px 23px 9px;font-size:10px;font-weight:700;color:#a1aaa7;letter-spacing:.3px;white-space:nowrap;transition:opacity .25s;flex:none}

.nav{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 10px 12px;display:flex;flex-direction:column;gap:4px;scrollbar-width:thin;scrollbar-color:#dfe4de transparent}
.nav::-webkit-scrollbar{width:4px}.nav::-webkit-scrollbar-thumb{background:#dfe4de;border-radius:4px}
.nav-item{position:relative;width:100%;flex:none;height:45px;display:flex;align-items:center;gap:12px;padding:0 13px;border:0;background:transparent;border-radius:12px;
  color:#687571;font-size:13px;text-align:right;transition:background .2s,color .2s,transform .15s;white-space:nowrap}
.nav-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
.nav-item svg{transition:transform .25s var(--ease)}
.nav-item:hover:not(.active){background:rgba(233,242,236,.55)}
.nav-item:hover .ic{transform:translateX(-2px) scale(1.06)}
.nav-item:active{transform:scale(.97)}
.nav-item.active{color:var(--brand);font-weight:700;background:#e9f2ec}
.nav-item.active::after{content:"";position:absolute;right:-10px;top:11.5px;width:3px;height:22px;background:var(--brand);border-radius:4px 0 0 4px;animation:barIn .3s var(--ease)}
@keyframes barIn{from{transform:scaleY(0)}to{transform:none}}
.chev{width:16px;height:16px;color:#a1aaa7;transition:transform .35s var(--ease),opacity .2s}
.group.open>.nav-item{color:#3c4b47;font-weight:700;background:rgba(233,242,236,.55)}
.group.open>.nav-item .chev{transform:rotate(180deg);color:var(--brand)}
.group.has-active>.nav-item{color:var(--brand)}
.sub-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.group.open .sub-wrap{grid-template-rows:1fr}
.sub{overflow:hidden;min-height:0}
.sub-in{margin:4px 14px 4px 0;border-right:1px solid #edf0ec;padding:0 0 0 0;display:flex;flex-direction:column;gap:2px}
.sub .nav-item{height:36px;font-size:12px;padding:0 12px;gap:10px;border-radius:10px;opacity:0;transform:translateX(6px);transition:opacity .25s,transform .3s var(--ease),background .2s,color .2s}
.group.open .sub .nav-item{opacity:1;transform:none;transition-delay:calc(var(--k) * 25ms + 60ms),calc(var(--k) * 25ms + 60ms),0s,0s}
.sub .nav-item .ic{width:16px;height:16px}
.sub .nav-item.active::after{right:-25px;top:7px}
.sub-in .nav-item{margin-right:6px;width:calc(100% - 6px)}

.sb-bottom{flex:none;border-top:1px solid #edf0ec;padding:14px 10px 18px}
.user{display:flex;align-items:center;gap:9px;background:#f4f5f1;border-radius:14px;height:53px;padding:0 7px;transition:background .2s,box-shadow .2s;cursor:default}
.user:hover{background:#eef0ea;box-shadow:inset 0 0 0 1px #e3e7e2}
.avatar{width:33px;height:33px;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;font-size:10px;display:grid;place-items:center;flex:none;transition:transform .25s var(--ease)}
.user:hover .avatar{transform:rotate(-6deg) scale(1.05)}
.who{flex:1;display:flex;flex-direction:column;line-height:1.35;white-space:nowrap;transition:opacity .2s}
.who b{font-size:11px;color:#182421}
.who small{font-size:9px;color:#72807c}
.logout{border:0;background:transparent;color:#687571;padding:4px;border-radius:8px;display:grid;place-items:center;transition:color .2s,background .2s}
.logout svg{width:17px;height:17px;transition:transform .25s var(--ease)}
.logout:hover{color:var(--red2);background:#fffefb}
.logout:hover svg{transform:translateX(-3px)}

body.collapsed .sidebar{width:78px}
body.collapsed .brand,body.collapsed .sb-label,body.collapsed .nav-item .t,body.collapsed .chev,body.collapsed .who,body.collapsed .logout{opacity:0;pointer-events:none}
body.collapsed .nav-item .t,body.collapsed .chev,body.collapsed .who,body.collapsed .logout{position:absolute}
body.collapsed .sub-wrap{grid-template-rows:0fr}
body.collapsed .nav-item{justify-content:center}
body.collapsed .user{justify-content:center}
body.collapsed .collapse-btn{transform:rotate(180deg)}
body.collapsed .collapse-btn:hover{transform:rotate(180deg) scale(1.08)}

/* ============ Main ============ */
.main{margin-right:280px;transition:margin .45s var(--ease);min-height:100vh;display:flex;flex-direction:column}
body.collapsed .main{margin-right:106px}
.header{margin:14px 20px 0;height:72px;border-radius:22px;background:#fffefb;
  border:1px solid rgba(24,36,33,.08);box-shadow:0 16px 25px rgba(30,45,40,.1);display:flex;align-items:center;justify-content:space-between;padding:0 25px;
  position:relative;z-index:20;animation:slideDown .5s var(--ease) both}
@keyframes slideDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.welcome{display:flex;flex-direction:column;align-items:flex-start}
.welcome small{font-size:10px;font-weight:700;line-height:12.5px;color:#167c65}
.welcome b{font-size:21px;font-weight:800;line-height:26.25px;color:#182421;padding-top:7px}
.welcome b .wave{display:inline-block;animation:fadeName .7s var(--ease) .25s both}
@keyframes fadeName{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.h-left{display:flex;gap:9px;align-items:center;direction:ltr;position:relative}
.icon-btn{width:42px;height:42px;border-radius:12px;background:#fffefb;border:1px solid #e3e7e2;display:grid;place-items:center;position:relative;color:#3c4b47;padding:0;transition:border-color .2s,box-shadow .2s,transform .15s}
.icon-btn:hover,.q-btn:hover{border-color:#cfd6cf;box-shadow:0 4px 12px rgba(32,43,38,.06)}
.icon-btn:active,.q-btn:active,.details:active,.collapse-btn:active{transform:scale(.97)}
#bellBtn svg{transform-origin:50% 10%}
#bellBtn:hover svg{animation:ring .6s ease}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
#guideBtn:hover svg{animation:flip .5s var(--ease)}
@keyframes flip{0%{transform:none}40%{transform:scaleX(.7)}100%{transform:none}}
.notif-dot{position:absolute;left:25px;top:8px;width:6px;height:6px;border-radius:3px;background:#e16b4f;border:1px solid #fff}
.notif-dot::after{content:"";position:absolute;inset:-1px;border-radius:50%;background:#e16b4f;animation:pulse 1.8s ease-out infinite}
.q-btn{height:42px;width:203px;display:flex;align-items:center;justify-content:center;gap:9px;padding:0 13px;background:#fffefb;border:1px solid #e3e7e2;border-radius:12px;color:#3c4b47;font-size:11px;transition:border-color .2s,box-shadow .2s,transform .15s}
.q-btn svg{width:18px;height:18px}
.q-btn .qchev{color:#97a09d;font-weight:700;transition:transform .3s var(--ease);display:inline-block;line-height:1;padding-bottom:4px}
.q-btn[aria-expanded="true"] .qchev{transform:rotate(180deg);padding-bottom:0;padding-top:4px}
.menu{position:absolute;top:50px;background:#fffefb;border:1px solid #e3e7e2;border-radius:14px;box-shadow:0 14px 34px rgba(32,43,38,.12);padding:6px;
  opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top left;pointer-events:none;transition:opacity .2s,transform .25s var(--ease);direction:rtl;z-index:40}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.q-menu{left:102px;width:203px}
.q-menu button{display:block;width:100%;text-align:right;border:0;background:transparent;padding:9px 12px;border-radius:9px;font-size:12px;color:#3c4b47;transition:background .15s}
.q-menu button:hover{background:#f4f5f1}
.q-menu button.sel{color:var(--brand);font-weight:700;background:#e9f2ec}
.n-menu{left:0;width:280px}
.n-menu h4{margin:6px 10px 8px;font-size:12px;color:#3c4b47}
.n-item{display:flex;gap:10px;padding:9px 10px;border-radius:9px;font-size:12px;color:#3c4b47;line-height:1.5;transition:background .15s}
.n-item:hover{background:#f4f5f1}
.n-item i{width:6px;height:6px;border-radius:50%;flex:none;margin-top:7px}
.n-item small{display:block;color:#89938f;font-size:10px}

.content{width:100%;max-width:1272px;margin:0 auto;padding:29px 16px 0}
.hero-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ag-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:30px 16px}
.sec-title{margin:60px 0 18px;font-size:28px;font-weight:500;line-height:32px;color:var(--ink)}
.sec-title.ag-title{margin-top:76px;margin-bottom:31px}

/* reveal */
.rv{opacity:0}
.rv.in{opacity:1;animation:fadeUp .6s var(--ease) var(--d,0ms) backwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* status tokens */
.s-ok{--c:var(--green);--bg:#f0faf5;--bd:#d1f0e0;--glow:rgba(7,148,85,.18)}
.s-part{--c:var(--yellow);--bg:#fffbf0;--bd:#fde8b0;--glow:rgba(254,200,75,.28)}
.s-no{--c:var(--red);--bg:#fff5f5;--bd:#fddfe0;--glow:rgba(240,68,56,.18)}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--bd);color:var(--c);font-size:12px;font-weight:500;line-height:16px;white-space:nowrap}
.s-no .badge,.badge.s-no{color:var(--red2)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.8);opacity:0}}
.s-no .dot::after{animation:pulseStrong 1.4s ease-out infinite}
@keyframes pulseStrong{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.3);opacity:0}}

/* hero */
.hero{background:#fffefb;border:1px solid #d2d6db;border-radius:24px;padding:24px;box-shadow:0 2px 6px rgba(139,111,78,.06);transition:box-shadow .3s}
.hero:hover{box-shadow:0 10px 28px rgba(139,111,78,.10)}
.hero h2{margin:0;padding-top:4px;font-size:28px;font-weight:500;line-height:24px;color:var(--ink)}
.hero-body{display:flex;gap:24px;align-items:center;padding-top:20px;min-height:193px}
.ring{width:140px;height:140px;position:relative;flex:none;transition:transform .35s var(--ease)}
.ring:hover{transform:scale(1.03)}
.ring svg{width:140px;height:140px;transform:rotate(-90deg)}
.ring .arc{stroke:var(--yellow);stroke-width:13;fill:none;stroke-linecap:round;stroke-dasharray:395.84;stroke-dashoffset:395.84}
.ring.in .arc{transition:stroke-dashoffset 1.4s var(--ease) .15s;stroke-dashoffset:0}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:700;color:var(--ink);direction:ltr}
.rows{flex:1;min-width:0;padding-top:20px}
.row{position:relative;padding:10px 0 0;border-radius:8px}
.row:first-child{padding-top:0}
.row-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;line-height:16px}
.row-top .lab{display:flex;align-items:center;gap:6px;color:var(--muted);transition:color .2s}
.row-top .lab i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.row-top .num{color:var(--c);font-weight:500}
.track{height:6px;background:var(--track);border-radius:999px;overflow:hidden;margin-top:4px;position:relative}
.fill{position:absolute;right:0;top:0;bottom:0;border-radius:999px;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform 1.1s var(--ease),filter .2s}
.in .fill{transform:scaleX(1)}
.row.g{--c:var(--green)} .row.y{--c:var(--yellow)} .row.r{--c:var(--red)} .row.n{--c:var(--gray)}
.row::after{content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 6px);background:#182421;color:#fff;font-size:11px;padding:6px 10px;border-radius:8px;white-space:nowrap;
  opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .2s,transform .2s var(--ease);z-index:5}
.row:hover::after{opacity:1;transform:none}
.row:hover .fill{filter:saturate(1.2) brightness(1.03)}
.row:hover .lab{color:var(--ink)}
.hero-foot{display:flex;justify-content:flex-end;padding-top:17px}

/* DGA outline button */
.details{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:30px;padding:0 12px;background:#fffefb;border:1px solid #e3e7e2;border-radius:8px;
  color:#3c4b47;font-family:var(--plex);font-size:12px;font-weight:500;line-height:18px;white-space:nowrap;transition:background .2s,border-color .2s,color .2s,transform .15s}
.details svg{width:14px;height:14px;stroke-width:1.8;transition:transform .25s var(--ease)}
.details:hover{background:#f4f5f1;border-color:#cfd6cf;color:var(--brand)}
.details:hover svg{transform:translateX(-3px)}

/* KPI card */
.kpi{background:#fffefb;border:1px solid #f0ede8;border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.16);
  transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.kpi:hover{transform:translateY(-4px);border-color:var(--bd);box-shadow:0 12px 26px rgba(0,0,0,.08),0 0 0 3px var(--glow)}
.kpi-top{display:flex;justify-content:flex-end;height:36px;padding-bottom:12px}
.kpi-num{display:flex;align-items:flex-end;gap:1px;height:40px}
.kpi-num .v{font-size:30px;font-weight:700;line-height:36px;color:var(--c);direction:ltr;margin-top:-6px;align-self:flex-start}
.kpi-num .p{font-size:16px;font-weight:500;color:var(--gray);line-height:24px;order:-1;margin-bottom:6px}
.kpi h3{margin:0;font-size:14px;font-weight:500;line-height:20px;color:var(--ink);height:32px;padding-bottom:12px}
.bar8{height:8px;background:var(--track);border-radius:999px;overflow:hidden;position:relative}
.bar8 .fill{box-shadow:0 0 6px var(--glow)}
.kpi:hover .bar8 .fill{filter:saturate(1.25) brightness(1.04)}
.kpi-meta{height:52px;padding-top:12px;display:flex;align-items:center}
.pill{background:#f4f5f1;border:1px solid #e3e7e2;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:500;color:#3c4b47;line-height:16px;transition:background .2s,color .2s}
.kpi:hover .pill{background:#e9f2ec;color:var(--brand)}
.kpi-act{padding-top:12px;display:flex;justify-content:flex-end}

/* Agency card */
.ag{position:relative;height:258px;background:#fffefb;border:1px solid #f0ede8;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.16);
  transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.ag.s-ok{--n:var(--green2);--tint:#f5fbf7}
.ag.s-part{--n:var(--yellow);--tint:#fffcf3}
.ag.s-no{--n:var(--red2);--tint:#fff8f7}
.ag:hover{transform:translateY(-4px);border-color:var(--bd);box-shadow:0 12px 26px rgba(0,0,0,.08),0 0 0 3px var(--glow)}
.ag .badge{position:absolute;top:20px;left:20px}
.ag h3{position:absolute;top:53px;left:0;right:0;margin:0;text-align:center;font-size:14px;font-weight:500;line-height:19.25px;color:var(--ink)}
.ag-num{position:absolute;top:99px;left:0;right:0;display:flex;justify-content:center;direction:ltr;gap:3px}
.ag-num .v{font-size:30px;font-weight:700;line-height:32px;color:var(--n)}
.ag-num .p{font-size:12px;color:var(--gray);line-height:16px;margin-top:8px}
.seg-wrap{position:absolute;left:20px;right:20px;top:133px;height:28px;direction:ltr}
.seg-lab{position:absolute;top:0;font-size:10px;font-weight:500;line-height:20px;transform:translate(-50%,3px);opacity:0;transition:opacity .35s,transform .35s var(--ease)}
.seg-bar{position:absolute;left:0;right:0;top:21px;height:7px;background:var(--track);border-radius:999px;overflow:hidden}
.seg{position:absolute;top:0;height:7px;border-radius:999px;box-shadow:0 0 6px rgba(227,160,8,.25);transform:scaleX(0);transform-origin:right;transition:transform .55s var(--ease)}
.ag.in .seg{transform:scaleX(1)}
.ag.in .seg-lab{opacity:1;transform:translate(-50%,0)}
.ag .details{position:absolute;top:202px;left:20px}

.footer{margin:auto 28px 0;padding:19px 4px;border-top:1px solid #e3e5e0;display:flex;justify-content:space-between;font-size:10px;color:#a1aaa7}

@media (max-width:1300px){.kpi-grid,.ag-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:1100px){.hero-grid{grid-template-columns:1fr}}
@media (max-width:900px){.sec-title,.sec-title.ag-title{margin-top:40px}}
@media (max-width:640px){
  .main,body.collapsed .main{margin-right:0;padding-right:86px}
  .header{margin:14px 10px 0;padding:0 12px;gap:8px}
  .welcome b{font-size:16px}
  .q-btn{width:auto}.q-btn .t{display:none}.q-menu{left:auto;right:0}
  .kpi-grid,.ag-grid{grid-template-columns:1fr}
  .hero-body{flex-direction:column}.rows{width:100%}
  .content{padding:20px 10px 0}
  .footer{margin-left:10px;margin-right:10px;flex-direction:column;gap:6px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv{opacity:1}.fill,.seg{transform:none}.seg-lab{opacity:1;transform:translate(-50%,0)}.ring .arc{stroke-dashoffset:0}
  .sub .nav-item{opacity:1;transform:none}
}

/* ============ Sub screens ============ */
#view{animation:viewIn .45s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:#89938f;margin-bottom:10px}
.crumbs a{color:var(--brand);text-decoration:none;font-weight:500;position:relative}
.crumbs a::after{content:"";position:absolute;right:0;left:0;bottom:-2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .25s var(--ease)}
.crumbs a:hover::after{transform:scaleX(1)}
.page-title{margin:0 0 24px;font-size:28px;font-weight:500;line-height:32px;color:var(--ink)}
.box{background:#fffefb;border:1px solid #f0ede8;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.16)}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid #f0ede8}
.box-h h3{margin:0;font-size:18px;font-weight:700;color:var(--ink)}
.box-h p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.mt{margin-top:24px}
.legend{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--blue)}

/* small bar */
.pbar{height:6px;background:var(--track);border-radius:999px;overflow:hidden;position:relative;min-width:80px}
.pbar i{position:absolute;right:0;top:0;bottom:0;border-radius:999px;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform 1s var(--ease) .25s}
.in .pbar i,.pbar.in i{transform:scaleX(1)}
.perf{display:flex;flex-direction:column;gap:4px;min-width:110px}
.perf b{font-size:13px;color:var(--ct,var(--c))}
.s-ok{--ct:var(--green)}.s-part{--ct:var(--ytext)}.s-no{--ct:var(--red)}.stat.s-na{--ct:var(--gray)}

/* summary card */
.summary{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:24px}
.sum-name{font-size:24px;font-weight:700;color:var(--ink);margin:0 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sum-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.stat{border:1px solid #f0ede8;border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;transition:border-color .2s,background .2s}
.stat:hover{background:#fafbf9;border-color:var(--bd,#e3e7e2)}
.stat span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.stat span i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.stat b{font-size:22px;color:var(--ct,var(--c))}
.stat.s-na{--c:var(--gray)}
.big-ring{width:150px;height:150px;position:relative}
.big-ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.big-ring .arc{fill:none;stroke:var(--c);stroke-width:12;stroke-linecap:round;stroke-dasharray:408.4;stroke-dashoffset:408.4;transition:stroke-dashoffset 1.4s var(--ease) .2s}
.in .big-ring .arc{stroke-dashoffset:var(--off)}
.big-ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big-ring .val b{font-size:30px;direction:ltr;color:var(--ct,var(--c))}
.big-ring .val small{font-size:11px;color:var(--muted)}

/* notes */
.notes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.note{padding:20px 22px}
.note h4{margin:0 0 14px;display:flex;align-items:center;gap:10px;font-size:17px;color:var(--ink)}
.note h4 i{width:6px;height:22px;border-radius:999px;background:var(--c)}
.note ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.note li{display:flex;align-items:center;gap:12px;font-size:14.5px;color:var(--ink)}
.note li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}

/* indicator card */
.ind{overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.ind:hover{transform:translateY(-3px);border-color:var(--bd);box-shadow:0 12px 26px rgba(0,0,0,.07),0 0 0 3px var(--glow)}
.ind-top{height:3px;background:var(--c)}
.ind-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px}
.ind-h h4{margin:0;font-size:15px;font-weight:700;color:var(--ink)}
.ind-h .r{display:flex;align-items:center;gap:14px}
.ind-h .num{font-size:30px;font-weight:700;color:var(--ct,var(--c));direction:ltr}
.facts{margin:0 18px 18px;background:#f6f7f4;border-radius:12px;display:grid;grid-template-columns:1.6fr repeat(7,1fr);padding:16px 8px}
.fact{text-align:center;display:flex;flex-direction:column;gap:8px;padding:0 6px}
.fact:first-child{text-align:right}
.fact small{font-size:13px;color:var(--muted)}
.fact b{font-size:14px;color:var(--ink)}
.fact b.hl{color:var(--ct,var(--c))}

/* tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.tbl td .badge{white-space:nowrap}
.tbl th{background:#f1f3ef;color:#182421;font-weight:800;font-size:12.5px;text-align:right;padding:14px 12px;border-bottom:2px solid #dfe3dd;white-space:normal;line-height:1.4}
.tbl td{white-space:nowrap;padding:13px 12px;border-bottom:1px solid #f0ede8;color:#1f2a27;font-weight:700;vertical-align:middle;line-height:1.5}
.tbl tbody tr{transition:background .2s}
.tbl tbody tr:nth-child(even){background:#fbfcfa}
.tbl tbody tr:hover{background:#e9f2ec}
.tbl td.name{font-weight:800;color:#182421;min-width:150px;white-space:normal}
.tbl td.wrap{white-space:normal;min-width:150px}
.tbl td.formula{white-space:normal;min-width:150px;font-size:11.5px;color:#3c4b47;max-width:180px;line-height:1.6}
.tbl td.hl{font-weight:700;color:var(--ct,var(--c))}
.in .tbl tbody tr{animation:rowIn .45s var(--ease) both;animation-delay:calc(var(--r,0) * 50ms + 150ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.shared{color:var(--blue)!important}
.tbl tr.sel{background:#e9f2ec!important}
.tbl tr.clickable{cursor:pointer}

.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 18px;border-radius:10px;border:0;background:var(--brand);color:#fff;font-size:13px;font-weight:500;box-shadow:0 2px 6px rgba(19,94,76,.22);transition:background .2s,box-shadow .2s,transform .15s}
.btn svg{width:14px;height:14px;stroke-width:2;transition:transform .25s var(--ease)}
.btn:hover{background:#0f4d3e;box-shadow:0 6px 14px rgba(19,94,76,.28)}
.btn:hover svg{transform:translateX(-3px)}
.btn:active{transform:scale(.97)}
.link-btn{border:0;background:transparent;color:var(--brand);font-size:13px;font-weight:500;padding:4px 8px;border-radius:6px;transition:background .2s}
.link-btn:hover{background:#e9f2ec}
.x-btn{width:36px;height:36px;border-radius:50%;border:0;background:#f4f5f1;color:#3c4b47;display:grid;place-items:center;font-size:16px;transition:background .2s,transform .3s var(--ease)}
.x-btn:hover{background:#e9f2ec;color:var(--brand);transform:rotate(90deg)}

/* agencies page */
.ag5{grid-template-columns:repeat(5,1fr)}
.ag.sel{border-color:var(--bd);box-shadow:0 0 0 3px var(--glow)}
.panel-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.panel-wrap.open{grid-template-rows:1fr}
.panel-wrap>div{overflow:hidden;min-height:0}
.ag-panel{margin-top:28px}
.ag-panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid #f0ede8}
.ag-panel-h .t{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700}
.ag-panel-h .t i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--ct,var(--c));font-weight:500}
.box-f{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid #f0ede8;font-size:12px;color:var(--muted)}

/* leader agencies list */
.al{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px 20px}
.al-row{display:grid;grid-template-columns:1fr 150px auto 16px;align-items:center;gap:16px;padding:14px 16px;border:1px solid #f0ede8;border-radius:12px;background:#fffefb;cursor:pointer;text-align:right;font-family:inherit;color:inherit;
  transition:border-color .2s,background .2s,transform .2s var(--ease)}
.al-row:hover{background:#fafbf9;border-color:var(--bd);transform:translateX(-3px)}
.al-row .n{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
.al-row .n i{width:7px;height:7px;border-radius:50%;background:var(--blue)}
.al-row .v{font-size:15px;font-weight:700;color:var(--ct,var(--c));direction:ltr;min-width:52px;text-align:left}
.al-row small{font-size:11px;color:var(--muted);grid-column:1}
.al-row svg{width:16px;height:16px;color:#a1aaa7;transition:transform .25s var(--ease),color .2s}
.al-row:hover svg{transform:translateX(-3px);color:var(--brand)}

/* accordion */
.acc{border:1px solid #f0ede8;border-radius:14px;background:#fffefb;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.acc+.acc{margin-top:10px}
.acc:hover{border-color:var(--bd)}
.acc.open{box-shadow:0 6px 18px rgba(0,0,0,.05);border-color:var(--bd)}
.acc-h{width:100%;display:flex;align-items:center;gap:16px;padding:16px 18px;border:0;background:transparent;text-align:right;font-family:inherit;color:inherit}
.acc-h .n{flex:1;font-size:15px;font-weight:700}
.acc-h .m{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--muted)}
.acc-h .m b{font-size:16px;color:var(--ct,var(--c));direction:ltr}
.acc-h .m em{font-style:normal;font-size:12px;color:var(--muted)}
.acc-h .m em b{font-size:13px;color:var(--ink)}
.acc-h .chv{width:18px;height:18px;color:#a1aaa7;transition:transform .35s var(--ease)}
.acc.open .acc-h .chv{transform:rotate(180deg);color:var(--brand)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-b>div{overflow:hidden;min-height:0}
.acc-in{padding:0 18px 18px}
.acc-in h5{margin:4px 0 10px;font-size:13px;color:var(--muted);font-weight:500}
.acc-in .tbl{min-width:520px}
.acc-in .tbl-wrap{border:1px solid #f0ede8;border-radius:10px}

/* sectors */
.sec-cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.sc{padding:16px;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s;text-align:right;font-family:inherit;color:inherit}
.sc:hover{transform:translateY(-4px);border-color:var(--bd);box-shadow:0 12px 26px rgba(0,0,0,.08),0 0 0 3px var(--glow)}
.sc .n{font-size:13px;font-weight:500;color:var(--ink);display:block;margin-bottom:10px}
.sc .v{font-size:26px;font-weight:700;color:var(--ct,var(--c));display:block;direction:ltr;text-align:right;margin-bottom:10px}
.tr-sec td:first-child{font-weight:700}
.tr-sec .tg{border:0;background:transparent;padding:0;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.tr-sec .tg svg{width:16px;height:16px;color:#a1aaa7;transition:transform .3s var(--ease)}
.tr-sec.open .tg svg{transform:rotate(180deg);color:var(--brand)}
.tr-sub{display:none}
.tr-sub.show{display:table-row;animation:rowIn .35s var(--ease) both}
.tr-sub td:first-child{padding-right:44px;color:#3c4b47}
.tbl td .pbar{max-width:160px}
.perf-row{display:flex;align-items:center;gap:10px}
.perf-row b{min-width:48px;font-size:13.5px;font-weight:800;color:var(--ct,var(--c));direction:ltr;text-align:right}
.perf-row .pbar{flex:1}

/* monthly */
.filters{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:16px 20px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);position:relative}
.sel-btn,.inp{height:40px;min-width:200px;border:1px solid #e3e7e2;border-radius:10px;background:#fffefb;padding:0 12px;font-family:inherit;font-size:13px;color:#3c4b47;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:border-color .2s,box-shadow .2s}
.sel-btn:hover,.inp:hover{border-color:#cfd6cf}
.inp:focus-within,.sel-btn[aria-expanded="true"]{border-color:var(--brand);box-shadow:0 0 0 4px rgba(19,94,76,.08)}
.inp input{border:0;outline:0;font:inherit;flex:1;background:transparent;color:#3c4b47}
.inp svg,.sel-btn svg{width:16px;height:16px;color:#89938f}
.sel-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.sel-btn svg{transition:transform .3s var(--ease)}
.m-menu{right:0;top:66px;width:200px;transform-origin:top right}
.m-menu button{display:block;width:100%;text-align:right;border:0;background:transparent;padding:8px 12px;border-radius:8px;font-size:12px;color:#3c4b47}
.m-menu button:hover{background:#f4f5f1}.m-menu button.sel{background:#e9f2ec;color:var(--brand);font-weight:700}
.legend-bar{display:flex;gap:28px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid #f0ede8;font-size:12px;color:var(--muted);background:#fbfcfa}
.legend-bar b{color:var(--ink);font-weight:500;margin-right:6px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .ic-wrap{width:64px;height:64px;border-radius:18px;background:#e9f2ec;color:var(--brand);display:grid;place-items:center;margin:0 auto 14px}
.empty .ic-wrap svg{width:28px;height:28px}
.empty h3{margin:0 0 6px;color:var(--ink);font-size:18px}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(18,28,24,.32);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .3s}
.modal.open{opacity:1;pointer-events:auto}
.dialog{width:min(860px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fffefb;border-radius:24px;box-shadow:0 32px 80px rgba(0,0,0,.2);transform:translateY(16px) scale(.97);transition:transform .4s var(--ease)}
.modal.open .dialog{transform:none}
.dlg-h{display:flex;align-items:flex-start;justify-content:space-between;padding:36px 44px 28px;border-bottom:1px solid #f0ede8}
.dlg-h small{font-size:15px;color:var(--gray)}
.dlg-h h2{margin:6px 0 0;font-size:28px;font-weight:700;color:var(--ink)}
.dlg-band{display:flex;align-items:center;justify-content:space-between;padding:28px 44px;background:var(--bg)}
.dlg-band .big{font-size:72px;font-weight:700;line-height:1;color:var(--ct,var(--c));direction:ltr;display:flex;align-items:baseline}
.dlg-band .big span{font-size:36px}
.dlg-band p{margin:8px 0 0;font-size:16px;color:var(--muted);text-align:center}
.dlg-band .badge{font-size:14px;padding:4px 12px}
.dlg-b{padding:28px 44px 36px;display:grid;gap:26px}
.dlg-b .note{padding:0}

@media (max-width:1300px){.ag5{grid-template-columns:repeat(3,1fr)}.sec-cards{grid-template-columns:repeat(3,1fr)}.facts{grid-template-columns:repeat(4,1fr);row-gap:16px}}
@media (max-width:1200px){.ag5{grid-template-columns:repeat(3,1fr)}.sec-cards{grid-template-columns:repeat(3,1fr)}.header{margin-left:12px;margin-right:12px}}
@media (max-width:1000px){.al{grid-template-columns:1fr}.facts{grid-template-columns:repeat(2,1fr)}.ind-h{flex-wrap:wrap}.notes{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.ag5,.sec-cards{grid-template-columns:1fr}.page-title,.sec-title{font-size:22px}.hero h2{font-size:22px}.acc-h{flex-wrap:wrap}.acc-h .m{flex-wrap:wrap;gap:8px}.box-h{flex-wrap:wrap}.summary{padding:18px}.big-ring{margin:0 auto}.filters .field,.sel-btn,.inp{width:100%}.dlg-h h2{font-size:22px}.facts{grid-template-columns:repeat(2,1fr)}.dlg-h,.dlg-band,.dlg-b{padding-left:20px;padding-right:20px}.dlg-band .big{font-size:52px}.al-row{grid-template-columns:1fr auto 16px}.al-row .pbar{display:none}}

html,body{overflow-x:clip}
.h-right{display:flex;align-items:center;gap:10px;min-width:0}
.menu-btn{display:none}
.scrim{position:fixed;inset:0;background:rgba(18,28,24,.3);backdrop-filter:blur(2px);z-index:28;opacity:0;pointer-events:none;transition:opacity .3s}
@media (max-width:1100px){
  .main,body.collapsed .main{margin-right:0;padding-right:0}
  .sidebar,body.collapsed .sidebar{width:270px;transform:translateX(calc(100% + 24px));transition:transform .4s var(--ease);animation:none}
  body.menu-open .sidebar{transform:none}
  body.menu-open .scrim{opacity:1;pointer-events:auto}
  body.collapsed .brand,body.collapsed .nav-item .t,body.collapsed .chev,body.collapsed .who,body.collapsed .logout{opacity:1;pointer-events:auto;position:static}
  body.collapsed .group.open .sub-wrap{grid-template-rows:1fr}
  body.collapsed .nav-item,body.collapsed .user{justify-content:flex-start}
  .collapse-btn{display:none}
  .menu-btn{display:grid}
  .header{margin:14px 16px 0}
  .content{padding-left:16px;padding-right:16px}
  .footer{margin-left:16px;margin-right:16px}
}
@media (max-width:640px){
  #guideBtn{display:none}
  .welcome small{display:none}
  .welcome b{font-size:15px;padding-top:0;white-space:nowrap}
  .header{height:64px}
  .hero{padding:18px}
}

/* monthly accordion table */
.m-filters{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.m-search{flex:0 1 460px;height:44px;background:#fffefb}
.m-dds{display:flex;gap:12px}
.m-dds .sel-btn{min-width:140px;height:44px;background:#fffefb}
.m-menu{top:52px;left:0;right:auto;max-height:300px;overflow:auto;transform-origin:top left}
.mtbl td{padding:16px 12px}
.mtbl tbody tr:nth-child(even){background:transparent}
.mtbl .m-main{cursor:pointer}
.mtbl .m-main:hover{background:#e9f2ec}
.mtbl .mrow.open .m-main{background:#fffefb}
.mtbl .mrow.open .m-main td{border-bottom-color:transparent}
.mtbl .mrow.open .m-main td:first-child{box-shadow:inset -3px 0 0 var(--brand);color:var(--brand)}
.mtbl .mrow.open .m-main:hover{background:#e9f2ec}
.row-tg{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:#687571;display:grid;place-items:center;transition:background .2s,color .2s}
.row-tg svg{width:16px;height:16px;transition:transform .35s var(--ease)}
.row-tg:hover{background:#e9f2ec;color:var(--brand)}
.mrow.open .row-tg{color:var(--brand);background:#e9f2ec}
.mrow.open .row-tg svg{transform:rotate(180deg)}
.mtbl .m-det td{padding:0;border-bottom:0;background:#f4f5f2}
.mtbl .mrow.open .m-det td{border-bottom:1px solid #e3e7e2;box-shadow:inset -3px 0 0 var(--brand),inset 0 6px 8px -8px rgba(0,0,0,.18)}
.mtbl .m-det:hover{background:transparent}
.det-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.mrow.open .det-wrap{grid-template-rows:1fr}
.det-wrap>div{overflow:hidden;min-height:0}
.det{display:flex;gap:0;flex-wrap:wrap;padding:16px 24px 18px;white-space:normal;opacity:0;transform:translateY(-4px);transition:opacity .3s,transform .35s var(--ease)}
.mrow.open .det{opacity:1;transform:none;transition-delay:.12s}
.det span{display:flex;flex-direction:column;gap:6px;padding:0 28px}
.det span:first-child{padding-right:0}
.det span+span{border-right:1px solid #dfe3dd}
.det em{font-style:normal;color:#687571;font-weight:600;font-size:12px}
.det b{font-weight:800;color:#182421;font-size:14px}
@media (max-width:640px){.m-search{flex:1 1 100%}.m-dds{width:100%}.m-dds .field{flex:1}.m-dds .sel-btn{min-width:0;width:100%}.det{gap:14px;flex-direction:column}}

/* ===== Structures ===== */
.obtn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:10px;border:1px solid #e3e7e2;background:#fffefb;color:#3c4b47;font-size:13px;font-weight:600;white-space:nowrap;transition:border-color .2s,background .2s,color .2s,transform .15s}
.obtn svg{width:16px;height:16px;transition:transform .3s var(--ease)}
.obtn:hover{border-color:var(--brand);color:var(--brand);background:#e9f2ec}
.obtn:hover svg{transform:translateY(-1px)}
.obtn[data-act="revertAll"]:hover svg{transform:rotate(-180deg)}
.obtn:active{transform:scale(.97)}
.s-tools .btn{height:42px}
.s-tools .btn svg{width:16px;height:16px}

  let start;setTimeout(()=>requestAnimationFrame(function f(t){start??=t;const p=Math.min((t-start)/1200,1),e=1-Math.pow(1-p,3);

}
function activate(card){
  card.classList.add('in');

  const d=parseInt(getComputedStyle(card).getPropertyValue('--d'))||0;
  card.querySelectorAll('.fill').forEach((f,j)=>f.style.transitionDelay=(d+200+j*90)+'ms');

  io?.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){activate(e.target);io.unobserve(e.target)}}),{threshold:.12});
  root.querySelectorAll('.rv').forEach(c=>io.observe(c));
}

/* lead indicator form: view / edit / new */
function leadForm(mode,id){
  const L=LEADS.find(x=>x.id===+id)||(mode==='new'?{id:null,name:'',goal:'',w:0}:LEADS[0]);
  const others=LEADS.filter(x=>x.id!==L.id).reduce((t,x)=>t+x.w,0);
  const remain=100-others-L.w, view_=mode==='view';
  const title=mode==='view'?'تفاصيل مؤشر قيادي':mode==='edit'?'تعديل مؤشر قيادي':'إضافة مؤشر قيادي';
  const ro=view_?'readonly':'';
  return `${crumbs([['إدارة المؤشرات القيادية','#/leads'],[title]])}
  <section class="box rv form-card ${view_?'is-view':''}" data-others="${others}">
    <div class="box-h"><h3>${title}</h3>${view_?`<span class="tpill sec">${ico('eye')}للعرض فقط</span>`:''}</div>
    <div class="form-grid">
      <label class="fld ro"><span>اجمالي الاوزان</span><input value="100" readonly tabindex="-1"></label>
      <label class="fld ro"><span>النسبة المتبقية</span><input id="lRemain" dir="ltr" value="${remain}" readonly tabindex="-1"><small class="err" id="eW2"></small></label>
      <label class="fld ${view_?'ro':''}"><span>اسم المؤشر ${view_?'':'<i class="req">*</i>'}</span><input id="lName" value="${L.name}" ${ro} placeholder="أدخل اسم المؤشر"><small class="err" id="eName"></small></label>
      <label class="fld ${view_?'ro':''}"><span>الهدف ${view_?'':'<i class="req">*</i>'}</span>
        ${view_?`<input value="${L.goal||'—'}" readonly>`:`<select id="lGoal"><option value="">اختر الهدف</option>${GOALS.map(g=>`<option ${g===L.goal?'selected':''}>${g}</option>`).join('')}</select>`}<small class="err" id="eGoal"></small></label>
      <label class="fld ${view_?'ro':''}"><span>وزن المؤشر ${view_?'':'<i class="req">*</i>'}</span><input id="lW" dir="ltr" ${view_?'readonly':'type="number" step="0.01" min="0"'} value="${L.w.toFixed(2)}"><small class="err" id="eW"></small></label>
    </div>
    <div class="form-f">${view_
      ?`<button class="obtn" data-go="#/leads">${ico('back')}<span>رجوع للقائمة</span></button>`
      :`<button class="btn" data-act="saveLead" data-id="${L.id??''}">${ico('check')}<span>حفظ</span></button><button class="obtn" data-go="#/leads">إلغاء</button>`}</div>
  </section>`;
}
V.lead=id=>leadForm('view',id);

function updRemain(){
  const card=view.querySelector('.form-card'),w=document.getElementById('lW'),r=document.getElementById('lRemain');if(!card||!w||!r)return;
  const rem=+(100-(+card.dataset.others)-(parseFloat(w.value)||0)).toFixed(2);
  r.value=rem;r.parentElement.classList.toggle('neg',rem<0);document.getElementById('eW2').textContent=rem<0?'مجموع الأوزان تجاوز 100':'';
}
function saveLead(btn){
  const n=document.getElementById('lName'),g=document.getElementById('lGoal'),w=document.getElementById('lW');
  const errs={eName:!n.value.trim()?'الرجاء إدخال اسم المؤشر':'',eGoal:!g.value?'الرجاء اختيار الهدف':'',
    eW:!(parseFloat(w.value)>0)?'الرجاء إدخال وزن أكبر من صفر':(+document.getElementById('lRemain').value<0?'الوزن أكبر من النسبة المتبقية':'')};
  let bad=false;
  for(const [id,m] of Object.entries(errs)){const el=document.getElementById(id),f=el.parentElement;el.textContent=m;f.classList.remove('bad');if(m){void f.offsetWidth;f.classList.add('bad');bad=true}}
  if(bad)return;
  const id=btn.dataset.id;
  if(id){const L=LEADS.find(x=>x.id===+id);Object.assign(L,{name:n.value.trim(),goal:g.value,w:+parseFloat(w.value).toFixed(2)});leadS.flash=L.id;toast('تم حفظ التعديلات بنجاح')}
  else{const nid=Math.max(...LEADS.map(x=>x.id))+1;LEADS.push({id:nid,name:n.value.trim(),goal:g.value,w:+parseFloat(w.value).toFixed(2)});leadS.flash=nid;toast('تمت إضافة المؤشر القيادي بنجاح')}
  location.hash='#/leads';
}

/* dialogs & toast */
function openDialog(html){dialog.className='dialog dlg-sm';dialog.innerHTML=html;modal.classList.add('open');modal.setAttribute('aria-hidden','false')}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.innerHTML=`${ico('check')}<span>${msg}</span>`;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
function saveAg(){
  const inp=document.getElementById('newAg'),err=document.getElementById('newErr'),v=inp.value.trim();
  let m='';if(!v)m='الرجاء إدخال اسم الوكالة';else if(STR.some(a=>a.name===v))m='هذه الوكالة موجودة مسبقاً';
  if(m){err.textContent=m;inp.parentElement.classList.remove('bad');void inp.offsetWidth;inp.parentElement.classList.add('bad');inp.focus();return}
  const id=Math.max(...STR.map(a=>a.id),...DEL.map(a=>a.id))+100;STR.unshift({id,name:v,st:'wait'});strS.page=1;strS.sort='';strS.flash=id;renderList('str');closeModal();toast('تمت إضافة الوكالة بنجاح');
}
let pendingRestore=null;
const confirmHTML=(title,msg,act,yes,no='إلغاء',danger=false)=>`<div class="cf"><div class="cf-ic ${danger?'danger':''}">!</div><h3>${title}</h3><p>${msg}</p>
  <div class="sm-f"><button class="btn ${danger?'danger':''}" data-act="${act}">${yes}</button><button class="obtn" data-act="closeModal">${no}</button></div></div>`;
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(t){const a=t.dataset.act;
    if(a==='addAg'){openDialog(`<div class="sm-h"><h3>إضافة وكالة جديدة</h3><button class="x-btn" data-act="closeModal" aria-label="إغلاق">✕</button></div>
      <label class="fld"><span>اسم الوكالة</span><input id="newAg" placeholder="أدخل اسم الوكالة..." maxlength="80" autocomplete="off"></label><small class="err" id="newErr"></small>
      <div class="sm-f"><button class="btn" data-act="saveAg">حفظ</button><button class="obtn" data-act="closeModal">إلغاء</button></div>`);
      setTimeout(()=>document.getElementById('newAg')?.focus(),80)}
    if(a==='saveAg')saveAg();
    if(a==='excel')toast('تم تجهيز ملف Excel للقائمة');
    if(a==='revertAll')openDialog(confirmHTML('هل أنت متأكد؟','هل تريد ارجاع جميع الوكالات المعتمدة للتعديل؟','doRevert','نعم، ارجاع'));
    if(a==='doRevert'){const n=STR.filter(x=>x.st==='ok').length;STR.forEach(x=>{if(x.st==='ok')x.st='tgt'});renderList('str');closeModal();toast(n?`تم ارجاع ${n} وكالات للتعديل`:'لا توجد وكالات معتمدة لإرجاعها')}
    if(a==='restore'){const d=DEL.find(x=>x.id===+t.dataset.id);pendingRestore=d.id;
      openDialog(confirmHTML('هل أنت متأكد؟',`هل أنت متأكد من استرجاع الوكالة <b>«${d.name}»</b>؟`,'doRestore','نعم، استرجاع'))}
    if(a==='doRestore'){const d=DEL.find(x=>x.id===pendingRestore);closeModal();if(!d)return;
      const tr=view.querySelector(`#delBody tr[data-rid="${d.id}"]`);tr?.classList.add('out');
      setTimeout(()=>{DEL=DEL.filter(x=>x.id!==d.id);STR.unshift({id:Math.max(...STR.map(a=>a.id))+100,name:d.name,st:'wait'});renderList('del');toast(`تم استرجاع «${d.name}» إلى قائمة الوكالات`)},320)}
    if(a==='saveLead')saveLead(t);
    return}
  const so=e.target.closest('.sort');
  if(so){const k=so.closest('[data-list]').dataset.list,S=LISTS[k].s,c=so.dataset.sort;S.dir=S.sort===c?-S.dir:1;S.sort=c;S.page=1;renderList(k);return}
  const pg=e.target.closest('.pg');
  if(pg&&!pg.disabled){const k=pg.closest('[data-list]').dataset.list;LISTS[k].s.page=+pg.dataset.pg;renderList(k);return}
  const tb=e.target.closest('.tab');
  if(tb){view.querySelectorAll('.tab').forEach(x=>{x.classList.toggle('on',x===tb);x.setAttribute('aria-selected',x===tb)});
    const pane=document.getElementById('qPane');if(!pane)return;pane.classList.remove('swap');void pane.offsetWidth;pane.innerHTML=qPane(+tb.dataset.tab);pane.classList.add('swap')}
});
document.addEventListener('input',e=>{
  if(e.target.classList.contains('list-q')){const k=e.target.dataset.list;LISTS[k].s.q=e.target.value.trim();LISTS[k].s.page=1;renderList(k)}
  if(e.target.id==='lW')updRemain();
});

  const startTxt=kind==='tgt'?TGT_START:undefined;
  return `<section class="box rv mt act-card" data-id="${R.id}" data-kind="${kind}">
    <div class="tabs" role="tablist">${readonly?'':`<button class="tab on" data-pane="act" role="tab" aria-selected="true">${ico('edit')}<b>الإجراءات</b></button>`}<button class="tab ${readonly?'on':''}" data-pane="tl" role="tab" aria-selected="${!!readonly}">${ico('history')}<b>مسار الطلب</b><i class="cnt-b">${R.tl.length}</i></button>${extra?`<button class="tab" data-pane="${extra.key}" role="tab" aria-selected="false">${ico(extra.icon)}<b>${extra.label}</b><i class="cnt-b">${extra.count}</i></button>`:''}
      ${readonly?`<span class="ro-tag">${ico('eye')}للعرض والمتابعة فقط</span>`:''}</div>
    ${readonly?'':`<div class="ap-pane on" id="pane-act">
      <div class="ap-form">
        <div class="fld" data-f="act"><span>الاجراء <i class="req">*</i></span><select id="apAct"><option value="">اختر الاجراء</option><option value="ok">${kind==='tgt'?'اعتماد المستهدفات':'اعتماد النتائج'}</option><option value="ret">إعادة الطلب للتعديل</option></select><small class="err"></small></div>
        <div class="fld" data-f="note"><span>الملاحظات <i class="req" id="noteReq" hidden>*</i></span><textarea id="apNote" rows="4" placeholder="اكتب ملاحظاتك هنا..."></textarea><small class="err"></small><small class="hint2">الملاحظات إلزامية عند إعادة الطلب</small></div>
      </div>
      <div class="form-f"><button class="btn" data-act="saveAp">${ico('check')}<span>حفظ</span></button></div>
    </div>`}
    <div class="ap-pane ${readonly?'on':''}" id="pane-tl">${timelineHTML(R.tl,startTxt)}</div>${extra?`<div class="ap-pane" id="pane-${extra.key}">${extra.html}</div>`:''}
  </section>`;
}

      <div class="roq full"><div class="iq-h"><span class="iq-n">3</span><span>${QL[2]}</span><span class="sub-hint">يُقيَّم كل جزء على حدة</span></div>
        <div class="yn-ro">${R.yn.map((y,k)=>`<div class="ynr"><span class="iq-sn">3.${k+1}</span><span class="yn-l">${y[0]}</span>${y[2]?`<button class="file-chip" data-act="dlFile" data-f="${y[2]}">${ico('file')}${y[2]}</button>`:''}<span class="ans-pill ${y[1]==='نعم'?'y':'n'}">${y[1]}</span>${sc(2+k)}</div>`).join('')}</div></div>
      ${[3,4,5,6,7].map(i=>`<div class="roq ${i===7?'full':''}"><div class="iq-h"><span class="iq-n">${i+1}</span><span>${QL[i]}</span>${sc(i+2)}</div>${ans(i)}</div>`).join('')}
    </div>${resultBox(R.sc,ed,R.st)}</section>
  <section class="box rv mt att-card"><div class="box-h"><h3>المرفقات</h3></div>
    <div class="att-row"><span class="g-ic">${ico('file')}</span><div class="g-t"><h3>مقترح الإبداع البلدي</h3><p>${R.file||'لم يتم إرفاق مقترح'}</p></div>${R.file?`<button class="obtn" data-act="dlFile" data-f="${R.file}">${ico('download')}<span>تحميل</span></button>`:''}</div></section>
  <section class="box rv mt act-card inno-act" data-id="${R.id}">
    <div class="tabs" role="tablist">${final?'':`<button class="tab on" data-pane="act" role="tab" aria-selected="true">${ico('edit')}<b>الإجراءات</b></button>`}<button class="tab ${final?'on':''}" data-pane="tl" role="tab" aria-selected="${final}">${ico('history')}<b>مسار الطلب</b><i class="cnt-b">${R.tl.length}</i></button></div>
    ${final?'':`<div class="ap-pane on" id="pane-act">${final?`<div class="final ${R.st==='i_ok'?'ok':'no'}"><span class="f-ic">${R.st==='i_ok'?ico('check'):'✕'}</span><div><b>${SS[R.st][1]}</b><p>انتهى الطلب ولا يوجد إجراء مطلوب.${R.tl[0][6]?' الملاحظات: '+R.tl[0][6]:''}</p></div></div>`:`
      ${R.st==='i_amin'?`<div class="stage-note">${ico('approve')}<span>تم عرض الفكرة على الأمين، اختر القرار النهائي للإبداع البلدي.</span></div>`:''}
      <div class="ap-form">
        <div class="fld" data-f="act"><span>الإجراء <i class="req">*</i></span><select id="inAct"><option value="">اختر الإجراء</option>${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select><small class="err"></small></div>
        <div class="fld" data-f="note"><span>الملاحظات <i class="req" id="inReq" hidden>*</i></span><textarea id="inNote" rows="3" placeholder="اكتب ملاحظاتك هنا..."></textarea><small class="err"></small><small class="hint2">الملاحظات إلزامية عند الرفض</small></div>
      </div>
      <div class="form-f"><button class="btn" data-act="saveInnoAct">${ico('check')}<span>حفظ</span></button><button class="obtn" data-go="#/inno-reviews">رجوع</button></div>`}</div>`}
    <div class="ap-pane ${final?'on':''}" id="pane-tl">${timelineHTML(R.tl,'بداية الطلب '+R.date)}</div>
  </section>`;
};
document.addEventListener('change',e=>{if(e.target.id==='inAct'){const v=e.target.value;document.getElementById('inReq').hidden=!(v==='rejIdea'||v==='reject')}});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='dlFile')toast(`جارٍ تحميل «${t.dataset.f}»`);
  if(t.dataset.act==='saveInnoAct'){
    const card=view.querySelector('.inno-act'),R=INNO.find(x=>x.id===+card.dataset.id),a=document.getElementById('inAct').value,n=document.getElementById('inNote').value.trim();
    const rej=a==='rejIdea'||a==='reject';
    let bad=fieldErr(card.querySelector('[data-f="act"]'),a?'':'الرجاء اختيار الإجراء');
    bad=fieldErr(card.querySelector('[data-f="note"]'),rej&&!n?'الملاحظات إلزامية عند الرفض':'')||bad;
    if(R.st==='i_wait'){const ins=[...view.querySelectorAll('.sc-in')];let miss=null;ins.forEach(x=>{const ok=x.value!==''&&+x.value>=0&&+x.value<=10;x.closest('.sc-box').classList.toggle('bad',!ok);if(!ok&&!miss)miss=x});
      if(miss){miss.closest('.roq').scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});toast('يرجى تقييم جميع الأسئلة قبل اتخاذ الإجراء');return}
      if(bad)return;R.sc=ins.map(x=>+(+x.value).toFixed(1))}
    if(bad)return;
    const map={showAmin:['i_amin','معروضة على الأمين','wait','تم عرض الفكرة على الأمين'],rejIdea:['i_rejI','الفكرة مرفوضة','ret','تم رفض الفكرة وانتهى الطلب'],
      accept:['i_ok','تم قبول الإبداع البلدي','ok','تم قبول الإبداع البلدي'],reject:['i_rej','تم رفض الإبداع البلدي','ret','تم رفض الإبداع البلدي وانتهى الطلب']}[a];
    const [d,tm]=nowStr();R.st=map[0];R.tl.unshift([d,tm,a==='accept'||a==='reject'?'الأمين':'لجنة التقييم',map[1],map[2],true,n]);inrS.flash=R.id;
    toast(map[3]);render();
  }
});

/* ===== scoring ===== */
const scBand=v=>v>=8?['ممتاز','ok']:v>=6.5?['جيد جداً','ok']:v>=5?['جيد','part']:['ضعيف','no'];
function scoreBox(i,v,ed){
  const w=v==null?0:v*10;
  return `<span class="sc-box ${ed?'':'ro'}" data-i="${i}">${ed?`<input class="sc-in" type="number" inputmode="decimal" min="0" max="10" step="0.1" placeholder="—" value="${v??''}" aria-label="تقييم البند ${i+1} من 10" dir="ltr">`:`<b class="${v==null?'':scBand(v)[1]}">${v??'—'}</b>`}<small>/ 10</small><i class="sc-bar"><i style="width:${w}%"></i></i></span>`;
}
const SC_N=10;
function scCalc(arr){const f=arr.filter(v=>v!=null&&!isNaN(v));const sum=f.reduce((a,b)=>a+b,0);return {n:f.length,sum,avg:f.length?sum/f.length:0,pct:sum/(SC_N*10)*100}}
function resultBox(arr,ed,st){
  const c=scCalc(arr),acc=st==='i_ok',score=acc?10:c.sum/SC_N,col=acc?'ok':(c.n?scBand(score)[1]:'');
  return `<div class="sc-res ${acc?'acc':''}" id="scRes"><div class="sr-main"><span class="sr-ring ${col}" style="--p:${score*10}"><b dir="ltr">${+score.toFixed(2)} / 10</b></span>
    <div><h4>${acc?'نتيجة التقييم النهائية':'نتيجة التقييم'}</h4>${acc?'<p>تم احتساب النتيجة 10 من 10 لقبول الإبداع البلدي</p>':(ed&&c.n<SC_N?`<p>تم تقييم <b>${c.n}</b> من ${SC_N} بنود</p>`:'')}</div></div></div>`;
}
document.addEventListener('input',e=>{
  if(!e.target.classList.contains('sc-in'))return;
  const x=e.target;let v=parseFloat(x.value);if(!isNaN(v)&&v>10){x.value=10;v=10}if(!isNaN(v)&&v<0){x.value=0;v=0}
  const box=x.closest('.sc-box');box.classList.remove('bad');box.querySelector('.sc-bar>i').style.width=(isNaN(v)?0:v*10)+'%';
  const arr=[...view.querySelectorAll('.sc-in')].map(i=>i.value===''?null:+i.value);
  document.getElementById('scRes').outerHTML=resultBox(arr,true);
});
document.addEventListener('focusout',e=>{if(e.target.classList?.contains('sc-in')&&e.target.value!==''){e.target.value=+(+e.target.value).toFixed(1)}});

/* ===== طلباتي (مقدم الطلب) ===== */
Object.assign(SS,{u_ok:['st-ok','مقبول'],u_rej:['st-no2','مرفوض'],u_wait:['st-wait','طلب جديد']});
const uSt=st=>st==='i_ok'?'u_ok':(st==='i_rej'||st==='i_rejI')?'u_rej':'u_wait';
Object.assign(SORD,{u_wait:0,u_ok:1,u_rej:2});
const myiS={q:'',sort:'',dir:1,size:10,page:1,flash:null};
LISTS.myi={s:myiS,rows:()=>INNO,text:a=>a.no+' '+a.title+' '+a.muni,cols:5,
  sorts:{no:(a,b)=>a.id-b.id,title:(a,b)=>a.title.localeCompare(b.title,'ar'),muni:(a,b)=>a.muni.localeCompare(b.muni,'ar'),st:(a,b)=>SORD[uSt(a.st)]-SORD[uSt(b.st)]},
  row:a=>`<td class="no" dir="ltr" style="text-align:right">${a.no}</td><td class="name">${a.title}</td><td>${a.muni}</td><td dir="ltr" style="text-align:right">${a.date}</td><td>${sBadge(uSt(a.st))}</td>`};
V.innovation=()=>`<div class="s-head rv"><h1 class="page-title">الإبداع البلدي</h1><button class="btn" data-go="#/inno-new">${ico('add')}<span>تقديم طلب إبداع بلدي</span></button></div>
  ${listBox('myi',[['رقم الطلب','no','act-th'],['عنوان المشاركة','title'],['الجهة','muni'],['تاريخ التقديم',''],['الحالة','st']])}`;

const menuBtn=document.getElementById('menuBtn'),scrim=document.getElementById('scrim');
menuBtn.addEventListener('click',e=>{e.stopPropagation();document.body.classList.toggle('menu-open')});
scrim.addEventListener('click',()=>document.body.classList.remove('menu-open'));
nav.addEventListener('click',e=>{if(e.target.closest('.leaf'))document.body.classList.remove('menu-open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('menu-open')});
render();
</script>
</body>
